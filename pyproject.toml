[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rpgmaker2godot"
version = "0.1.0"

# Numeric counter incremented by scripts/build_exe.ps1 on every
# generated executable; displayed in the CLI banner after the
# version (e.g. "rpgmaker2godot v0.1.0 build 12").
build = 9
description = "Convert RPG Maker MV/MZ tilesets to Godot resources."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "ultra-sonic-28" }
]
dependencies = [
    "Pillow>=11.0",
    "rich>=13.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
rpgmaker2godot = "rpgmaker2godot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests requiring external applications such as Godot",
]